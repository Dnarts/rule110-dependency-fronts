name: Verify Rule 110 research artifacts
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  computational:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check supplied Lean attestation integrity
        run: python scripts/verify_attested_lean.py
      - name: Check finite certificates (Python)
        run: |
          python scripts/rule110_certificate.py --coverage-time 100 --coverage-period 6 --output /tmp/audit100.json
          python scripts/rule110_large_coverage.py --max-time 2000 --max-period 10 --output /tmp/audit2000.json
      - name: Independently check Rule 110 N=20 exhaustive enumeration
        run: |
          python -m pip install -r requirements-ring20.txt
          python scripts/rule110_ring20_numpy.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: TypeScript independent cross-check
        run: |
          npm install --global typescript@5.8.3
          mkdir -p /tmp/rule110-ts
          tsc --strict --target ES2022 --module commonjs --skipLibCheck --outDir /tmp/rule110-ts scripts/rule110_crosscheck.ts
          node /tmp/rule110-ts/rule110_crosscheck.js
  formal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install standalone Lean 4 through elan
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.35.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version
      - name: Compile formalized theorems and check axiom reports
        shell: bash
        run: |
          set -euo pipefail
          lean formal/rule110_complete.lean | tee /tmp/lean_axioms.log
          ! grep -q 'sorryAx' /tmp/lean_axioms.log
          test "$(grep -c 'depends on axioms:' /tmp/lean_axioms.log)" -eq 4
  manuscript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install TeX dependencies and compile manuscript
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq texlive-latex-base texlive-latex-recommended texlive-fonts-recommended texlive-latex-extra latexmk
          cd paper
          latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex
      - name: Typeset all three final manuscripts
        run: |
          sudo apt-get install -y -qq texlive-xetex
          make package-v2

  full-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Lean toolchain
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain "$(cat lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Rebuild and verify the all-time theorem
        run: make verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lean-verification-log
          path: build/verify.log

  publish-v2:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.before == '50a096db3c060fb015e9ce8fa25e5b0a527dae31'
    needs: [full-proof, computational, formal, manuscript]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish verified preprints
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          v1_commit=2ec89cecea3c444b69c7768ca0bac20ecb25ae25
          gh release create v1.0.0 --target "$v1_commit" --title 'First preprint' \
            --notes 'Published manuscript and DOI: https://doi.org/10.5281/zenodo.24334185' \
            paper/main.pdf || test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v1.0.0" --jq '.object.sha')" = "$v1_commit"
          python3 scripts/package_v2.py
          gh release create v2.0.0 --target "$GITHUB_SHA" --title 'Exact essential coordinates for all times' \
            --notes-file docs/release-v2.md dist/v2/* verification/v2/final.log
